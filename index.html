<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automated Banking Cloud</title>
<style>
  body { font-family: Arial, sans-serif; background:#f0f4f8; margin:0; color:#1a2b3c; }
  header { background:#0b3d91; color:#fff; padding:16px 24px; font-size:20px; }
  main { max-width:760px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border-radius:8px; padding:20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  input, button { padding:10px; margin:4px 0; width:100%; box-sizing:border-box; font-size:15px; }
  button { background:#0b3d91; color:#fff; border:0; border-radius:4px; cursor:pointer; }
  button.alt { background:#6b7c93; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > div { flex:1; min-width:220px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px; border-bottom:1px solid #e1e8ef; text-align:left; }
  #msg { padding:10px; border-radius:4px; display:none; margin-bottom:16px; }
  .ok { background:#d8f3dc; } .err { background:#ffd6d6; }
  .big { font-size:30px; font-weight:bold; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>🏦 Automated Banking Cloud</header>
<main>
  <div id="msg"></div>

  <!-- Auth -->
  <div id="auth" class="row">
    <div class="card">
      <h3>Login</h3>
      <input id="l_acc" placeholder="Account number">
      <input id="l_pw" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>
    <div class="card">
      <h3>Open New Account</h3>
      <input id="r_name" placeholder="Full name">
      <input id="r_pw" type="password" placeholder="Password (min 6 chars)">
      <input id="r_dep" type="number" step="0.01" placeholder="Initial deposit (optional)">
      <button class="alt" onclick="register()">Create Account</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <div class="card">
      <div id="who"></div>
      <div class="big" id="bal">0.00</div>
      <button class="alt" onclick="logout()" style="width:auto;padding:6px 14px">Logout</button>
    </div>
    <div class="row">
      <div class="card">
        <h3>Deposit / Withdraw</h3>
        <input id="amt" type="number" step="0.01" placeholder="Amount">
        <button onclick="act('deposit')">Deposit</button>
        <button class="alt" onclick="act('withdraw')">Withdraw</button>
      </div>
      <div class="card">
        <h3>Transfer</h3>
        <input id="t_acc" placeholder="Destination account number">
        <input id="t_amt" type="number" step="0.01" placeholder="Amount">
        <button onclick="transfer()">Send</button>
      </div>
    </div>
    <div class="card">
      <h3>Recent Transactions</h3>
      <table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>With</th><th>Balance</th></tr></thead>
      <tbody id="tx"></tbody></table>
    </div>
  </div>
</main>

<script>
let token = sessionStorage.getItem("token");
const $ = id => document.getElementById(id);

function show(text, ok = true) {
  const m = $("msg"); m.textContent = text; m.className = ok ? "ok" : "err"; m.style.display = "block";
  setTimeout(() => m.style.display = "none", 5000);
}

async function api(path, method = "GET", body) {
  const res = await fetch("/api/" + path, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function register() {
  try {
    const d = await api("register", "POST", { name: $("r_name").value, password: $("r_pw").value, initial_deposit: $("r_dep").value });
    show("Account created! Your account number is " + d.account_no + " - save it to log in.");
    $("l_acc").value = d.account_no;
  } catch (e) { show(e.message, false); }
}

async function login() {
  try {
    const d = await api("login", "POST", { account_no: $("l_acc").value, password: $("l_pw").value });
    token = d.token; sessionStorage.setItem("token", token);
    loadDash();
  } catch (e) { show(e.message, false); }
}

async function logout() {
  try { await api("logout", "POST"); } catch (e) {}
  token = null; sessionStorage.removeItem("token");
  $("dash").classList.add("hidden"); $("auth").classList.remove("hidden");
}

async function loadDash() {
  try {
    const b = await api("balance");
    $("who").textContent = b.name + " (" + b.account_no + ")";
    $("bal").textContent = b.balance.toFixed(2);
    const tx = await api("transactions");
    $("tx").innerHTML = tx.map(t => `<tr><td>${t.date.replace("T"," ").slice(0,19)}</td><td>${t.type}</td>
      <td>${t.amount.toFixed(2)}</td><td>${t.counterparty || "-"}</td><td>${t.balance_after.toFixed(2)}</td></tr>`).join("");
    $("auth").classList.add("hidden"); $("dash").classList.remove("hidden");
  } catch (e) { logout(); }
}

async function act(kind) {
  try { const d = await api(kind, "POST", { amount: $("amt").value }); show(d.message); $("amt").value = ""; loadDash(); }
  catch (e) { show(e.message, false); }
}

async function transfer() {
  try {
    const d = await api("transfer", "POST", { to_account: $("t_acc").value, amount: $("t_amt").value });
    show(d.message); $("t_acc").value = $("t_amt").value = ""; loadDash();
  } catch (e) { show(e.message, false); }
}

if (token) loadDash();
</script>
</body>
</html>
